<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#c7e8ef" />
    <meta name="description" content="奶油色治愈系网页虚拟宠物房间原型" />
    <title>布丁小屋 · Room UI V1</title>
    <link rel="stylesheet" href="./css/base.css" />
    <link rel="stylesheet" href="./css/room.css" />
    <link rel="stylesheet" href="./css/ui.css" />
    <link rel="stylesheet" href="./css/animations.css" />
    <script src="./js/app.js" defer></script>
    <script src="./js/interactions.js" defer></script>
  </head>
  <body>
    <main class="game-shell" aria-label="布丁小屋虚拟宠物游戏">
      <section class="room" aria-label="宠物生活的房间">
        <img class="room__background" src="./assets/generated/room-background.webp" alt="" />

        <header class="hud" aria-label="宠物状态">
          <div class="stat stat--happy" data-stat="happiness">
            <span class="stat__symbol" aria-hidden="true">♥</span>
            <span class="stat__meter"><i style="--value: 80%"></i></span>
            <strong>80<small>/100</small></strong>
          </div>
          <div class="stat stat--full" data-stat="fullness">
            <img src="./assets/generated/icon-food.webp" alt="" />
            <span class="stat__meter"><i style="--value: 60%"></i></span>
            <strong>60<small>/100</small></strong>
          </div>
          <div class="stat stat--energy" data-stat="energy">
            <span class="stat__symbol" aria-hidden="true">ϟ</span>
            <span class="stat__meter"><i style="--value: 70%"></i></span>
            <strong>70<small>/100</small></strong>
          </div>
          <div class="coin-pill" aria-label="金币 320"><span aria-hidden="true">●</span><strong>320</strong></div>
        </header>

        <button class="scene-object lamp" data-object="lamp" aria-label="打开吊灯">
          <img src="./assets/generated/lamp.webp" alt="" draggable="false" />
        </button>
        <button class="scene-object window" data-object="window" aria-label="看看窗外">
          <img src="./assets/generated/window.webp" alt="" draggable="false" />
          <span class="window__shine" aria-hidden="true"></span>
        </button>
        <button class="scene-object cabinet" data-object="cabinet" aria-label="查看柜子">
          <img src="./assets/generated/cabinet.webp" alt="" draggable="false" />
        </button>
        <button class="scene-object bed" data-object="bed" aria-label="去小床睡觉">
          <img src="./assets/generated/bed.webp" alt="" draggable="false" />
        </button>
        <button class="scene-object food-bowl" data-object="food-bowl" aria-label="去饭盆吃饭">
          <img src="./assets/generated/food-bowl.webp" alt="" draggable="false" />
        </button>
        <button class="scene-object ball" data-object="ball" aria-label="玩小球">
          <img src="./assets/generated/ball.webp" alt="" draggable="false" />
        </button>

        <div class="pet-zone" aria-label="宠物活动区域">
          <button class="scene-object pet" data-object="pet" aria-label="摸摸奶糖">
            <span class="pet__shadow" aria-hidden="true"></span>
            <img src="./assets/generated/pet-v3.webp" alt="戴棕色贝雷帽的奶黄色垂耳小狗奶糖" draggable="false" />
          </button>
        </div>

        <div class="effects" aria-live="polite"><span class="feedback-bubble"></span></div>
      </section>

      <nav class="bottom-nav" aria-label="宠物功能">
        <button class="nav-action nav-action--food" data-action="food"><span class="nav-action__icon"><img src="./assets/generated/icon-food.webp" alt="" /></span><small>吃饭</small></button>
        <button class="nav-action nav-action--play" data-action="play"><span class="nav-action__icon"><img src="./assets/generated/icon-play.webp" alt="" /></span><small>玩耍</small></button>
        <button class="nav-action nav-action--clean" data-action="clean"><span class="nav-action__icon"><img src="./assets/generated/icon-clean.webp" alt="" /></span><small>清洁</small></button>
        <button class="nav-action nav-action--sleep" data-action="sleep"><span class="nav-action__icon"><img src="./assets/generated/icon-sleep.webp" alt="" /></span><small>睡觉</small></button>
        <button class="nav-action nav-action--dress" data-action="dress"><span class="nav-action__icon"><img src="./assets/generated/icon-dress.webp" alt="" /></span><small>换装</small></button>
      </nav>

      <section class="bottom-sheet" aria-hidden="true" aria-label="功能面板">
        <div class="bottom-sheet__handle"></div>
        <button class="bottom-sheet__close" type="button" aria-label="关闭功能面板">×</button>
        <h2>功能准备中</h2>
        <p>这里会在后续版本放入可选择的物品。</p>
      </section>
    </main>
  </body>
</html>
